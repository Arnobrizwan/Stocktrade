name: Deploy static demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      STATIC_EXPORT: "1"
      NEXT_PUBLIC_STATIC_MODE: "1"
      NEXT_PUBLIC_BASE_PATH: "/Stocktrade"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Strip server-only surfaces
        # A static export cannot contain route handlers, middleware or the
        # Clerk-backed auth pages. The snapshot in public/data replaces them.
        run: |
          rm -rf src/app/api
          rm -rf "src/app/sign-in" "src/app/sign-up"
          rm -f src/middleware.ts

      - name: Build static export
        run: npx next build

      - name: Disable Jekyll processing
        run: touch out/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
